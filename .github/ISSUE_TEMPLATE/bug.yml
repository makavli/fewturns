name: Something is wrong
description: The audit miscounts, a lever does nothing, or the skill misbehaves.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Paste the part of the audit that is wrong. Remove anything private first; the report prints folder names.
    validations:
      required: true
