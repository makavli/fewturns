<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The fixed load before and after /fewturns trim</title>
<desc id="d">Fixed load on every request for a made-up setup with three plugins. Before: about 6,278 tokens. After /fewturns trim: about 4,249 tokens. Hooks on every prompt or tool call: 6 before, 0 after. MCP servers: 2 before, 0 after. Skill descriptions cut short to fit the budget: Yes before, No after.</desc>
<rect x="0.5" y="0.5" width="879" height="395" rx="16" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<text x="64" y="52" font-size="22" font-weight="650" fill="#f0efec" text-anchor="start">The fixed load, before and after</text>
<text x="64" y="74" font-size="15" font-weight="400" fill="#c3c2b7" text-anchor="start">A made-up setup with three plugins. Tokens resent with every request.</text>
<text x="64" y="108" font-size="15" font-weight="400" fill="#c3c2b7" text-anchor="start">Before</text>
<rect x="64.0" y="118" width="195.5" height="28" rx="4" fill="#3987e5"/><text x="74.0" y="137" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">2,000</text>
<rect x="261.5" y="118" width="177.9" height="28" rx="4" fill="#d95926"/><text x="271.5" y="137" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">1,822</text>
<rect x="441.4" y="118" width="97.4" height="28" rx="4" fill="#199e70"/><text x="451.4" y="137" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">1,006</text>
<rect x="540.8" y="118" width="141.2" height="28" rx="4" fill="#c98500"/><text x="550.8" y="137" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">1,450</text>
<text x="698" y="138" font-size="17" font-weight="650" fill="#f0efec" text-anchor="start">6,278 tokens</text>
<text x="64" y="170" font-size="15" font-weight="400" fill="#c3c2b7" text-anchor="start">After /fewturns trim</text>
<rect x="64.0" y="180" width="120.3" height="28" rx="4" fill="#3987e5"/><text x="74.0" y="199" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">1,238</text>

<rect x="186.3" y="180" width="152.1" height="28" rx="4" fill="#199e70"/><text x="196.3" y="199" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">1,560</text>
<rect x="340.3" y="180" width="141.2" height="28" rx="4" fill="#c98500"/><text x="350.3" y="199" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">1,450</text>
<text x="497.55481224863615" y="200" font-size="17" font-weight="650" fill="#f0efec" text-anchor="start">4,249 tokens</text>
<rect x="64" y="232" width="12" height="12" rx="3" fill="#3987e5"/><text x="82" y="243" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Skill listing</text>
<rect x="199.60000000000002" y="232" width="12" height="12" rx="3" fill="#d95926"/><text x="217.60000000000002" y="243" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Agent listing</text>
<rect x="335.20000000000005" y="232" width="12" height="12" rx="3" fill="#199e70"/><text x="353.20000000000005" y="243" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Instruction files</text>
<rect x="499.6" y="232" width="12" height="12" rx="3" fill="#c98500"/><text x="517.6" y="243" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Memory index</text>
<line x1="64" y1="268" x2="816" y2="268" stroke="#2c2c2a"/>
<text x="64" y="300" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Hooks on every prompt or tool call</text>
<text x="64" y="330" font-size="22" font-weight="650" fill="#f0efec" text-anchor="start">6  →  0</text>
<text x="340" y="300" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">MCP servers</text>
<text x="340" y="330" font-size="22" font-weight="650" fill="#f0efec" text-anchor="start">2  →  0</text>
<text x="520" y="300" font-size="13" font-weight="400" fill="#c3c2b7" text-anchor="start">Skill descriptions cut short to fit</text>
<text x="520" y="330" font-size="22" font-weight="650" fill="#f0efec" text-anchor="start">Yes  →  No</text>
<text x="64" y="372" font-size="13" font-weight="400" fill="#898781" text-anchor="start">An estimate (characters / 4) of the test fixture, not a benchmark. Reproduce it: node tools/demo.mjs</text>
